# tex-fmt configuration
# https://github.com/WGUNDERWOOD/tex-fmt

# Line wrapping
wrap = true
wraplen = 100 # maximum line length
wrapmin = 90 # wrap break point is chosen at the first opportunity past this column
# wrap-chars = [] # For example: ["。"]


# Normalize short paragraphs and multiline optional arguments.
join = true
format_options = true

# Indentation.
tabsize = 2
tabchar = "space" # "space" or "tab"

# Table alignment can create large diffs, so leave it opt-in.
format-tables = false

# Terminal output: "warn" or "error".
verbosity = "warn"

# Project-specific environments.
# lists = ["myitemize"]
# verbatims = ["myverbatim"]
# no-indent-envs = ["document"]

# Invocation modes normally belong on the command line. Uncomment only when
# every tex-fmt invocation in this repository should use the selected mode.
# check = false
# print = false
# fail-on-change = false
# stdin = false
